<div class="tc-bar">
  <label class="tc-label" for="tc-input">Tipo de cambio</label>
  <div class="tc-input-wrap">
    <span class="tc-prefix" aria-hidden="true">$</span>
    <input id="tc-input" class="tc-input" type="text" inputmode="numeric"
      [value]="fmt(month().exchangeRate)" (change)="onRateChange($any($event.target))" />
    <span class="tc-suffix">ARS/USD</span>
  </div>
  <button type="button" class="refresh" (click)="refreshBlue()" [disabled]="refreshing()"
    aria-label="Actualizar con dólar blue (promedio compra/venta)" title="Dólar blue promedio">
    <mat-icon aria-hidden="true" [class.spin]="refreshing()">refresh</mat-icon>
  </button>
</div>
